---
- name: Install Brave Browser
  hosts: all
  become: true
  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - curl
        state: present
        update_cache: true

    - name: Download Brave signing-key
      ansible.builtin.get_url:
        url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
        dest: /tmp/brave-browser-archive-keyring.gpg
        mode: '0644'

    - name: Convert signing-key into ascii format
      ansible.builtin.command:
        cmd: gpg --dearmor --yes -o /tmp/brave-browser-archive-keyring-dearmored.gpg /tmp/brave-browser-archive-keyring.gpg
      args:
        creates: /tmp/brave-browser-archive-keyring-dearmored.gpg

    - name: Add Brave repository
      ansible.builtin.deb822_repository:
        name: brave-browser
        types: [deb]
        uris: https://brave-browser-apt-release.s3.brave.com/
        suites: stable
        components: [main]
        signed_by: /tmp/brave-browser-archive-keyring-dearmored.gpg
        state: present
        enabled: true

    - name: Update apt-cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Brave Browser
      ansible.builtin.apt:
        name: brave-browser
        state: present

    - name: Clean up temporary files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/brave-browser-archive-keyring.gpg
        - /tmp/brave-browser-archive-keyring-dearmored.gpg